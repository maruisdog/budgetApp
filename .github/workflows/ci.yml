name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run pytest with 100% coverage
        run: python -m pytest --cov=budget --cov-report=term-missing --cov-fail-under=100

      - name: Check cyclomatic complexity with radon and xenon
        run: |
          python -m radon cc budget tests -s -a
          python -m xenon --max-absolute B --max-average B --max-modules B budget tests

      - name: Run flake8
        run: python -m flake8 budget tests
